<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectHub - Project Management Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="container">
                <div class="logo">📋 ProjectHub</div>
                <div class="nav-actions">
                    <span id="user-name"></span>
                    <button id="logout-btn" class="btn" style="display:none;">Logout</button>
                </div>
            </div>
        </nav>

        <!-- Auth Page -->
        <div id="auth-page" class="auth-container">
            <div class="auth-card">
                <h1>ProjectHub</h1>
                <p>Project & Task Management Tool</p>
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">Login</button>
                    <button class="tab-btn" data-tab="register">Register</button>
                </div>
                <div id="login-tab" class="tab-content active">
                    <form onsubmit="handleLogin(event)">
                        <input type="email" name="email" placeholder="Email" required>
                        <input type="password" name="password" placeholder="Password" required>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
                <div id="register-tab" class="tab-content">
                    <form onsubmit="handleRegister(event)">
                        <input type="text" name="name" placeholder="Full Name" required>
                        <input type="email" name="email" placeholder="Email" required>
                        <input type="password" name="password" placeholder="Password" minlength="6" required>
                        <button type="submit" class="btn btn-primary">Register</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Main App -->
        <div id="main-app" style="display:none;">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h3>Projects</h3>
                    <button class="btn-icon" onclick="showCreateProjectModal()">+</button>
                </div>
                <div id="projects-list" class="projects-list"></div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <div id="project-view">
                    <div class="empty-state">
                        <h2>Welcome to ProjectHub</h2>
                        <p>Select a project from the sidebar or create a new one to get started</p>
                    </div>
                </div>
            </main>
        </div>

        <!-- Create Project Modal -->
        <div id="project-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('project-modal')">&times;</span>
                <h2>Create New Project</h2>
                <form onsubmit="handleCreateProject(event)">
                    <div class="form-group">
                        <label>Project Name *</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" name="startDate">
                        </div>
                        <div class="form-group">
                            <label>End Date</label>
                            <input type="date" name="endDate">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Project</button>
                </form>
            </div>
        </div>

        <!-- Create Task Modal -->
        <div id="task-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('task-modal')">&times;</span>
                <h2>Create New Task</h2>
                <form onsubmit="handleCreateTask(event)">
                    <div class="form-group">
                        <label>Task Title *</label>
                        <input type="text" name="title" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Priority</label>
                            <select name="priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Due Date</label>
                            <input type="date" name="dueDate">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Assign To</label>
                        <select name="assignedTo" id="assign-select">
                            <option value="">Unassigned</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Create Task</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
