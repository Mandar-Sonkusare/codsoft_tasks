<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub - E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="container">
                <div class="logo">🛍️ ShopHub</div>
                <div class="nav-search">
                    <input type="text" id="search-input" placeholder="Search products...">
                </div>
                <div class="nav-actions">
                    <button id="cart-btn" class="icon-btn">
                        🛒 Cart <span id="cart-count" class="badge">0</span>
                    </button>
                    <button id="auth-btn" class="btn">Login</button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="main-content">
            <!-- Home Page -->
            <section id="home-page">
                <div class="hero">
                    <div class="container">
                        <h1>Welcome to ShopHub</h1>
                        <p>Discover amazing products at great prices</p>
                    </div>
                </div>

                <div class="container">
                    <div class="filters">
                        <select id="category-filter">
                            <option value="all">All Categories</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Books">Books</option>
                            <option value="Home">Home & Living</option>
                            <option value="Sports">Sports</option>
                        </select>
                        <select id="sort-filter">
                            <option value="newest">Newest First</option>
                            <option value="price-asc">Price: Low to High</option>
                            <option value="price-desc">Price: High to Low</option>
                            <option value="rating">Highest Rated</option>
                        </select>
                    </div>

                    <div id="products-grid" class="products-grid">
                        <div class="loading">Loading products...</div>
                    </div>
                </div>
            </section>

            <!-- Product Detail Page -->
            <section id="product-page" style="display:none;">
                <div class="container">
                    <button class="btn-back" onclick="showPage('home')">← Back to Products</button>
                    <div id="product-detail"></div>
                </div>
            </section>

            <!-- Cart Page -->
            <section id="cart-page" style="display:none;">
                <div class="container">
                    <h2>Shopping Cart</h2>
                    <div id="cart-content"></div>
                </div>
            </section>

            <!-- Checkout Page -->
            <section id="checkout-page" style="display:none;">
                <div class="container">
                    <h2>Checkout</h2>
                    <div id="checkout-content"></div>
                </div>
            </section>

            <!-- Orders Page -->
            <section id="orders-page" style="display:none;">
                <div class="container">
                    <h2>My Orders</h2>
                    <div id="orders-content"></div>
                </div>
            </section>
        </main>

        <!-- Auth Modal -->
        <div id="auth-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div id="auth-tabs">
                    <button class="tab-btn active" data-tab="login">Login</button>
                    <button class="tab-btn" data-tab="register">Register</button>
                </div>
                <div id="login-form" class="tab-content active">
                    <form onsubmit="handleLogin(event)">
                        <input type="email" name="email" placeholder="Email" required>
                        <input type="password" name="password" placeholder="Password" required>
                        <button type="submit" class="btn btn-primary">Login</button>
                    </form>
                </div>
                <div id="register-form" class="tab-content">
                    <form onsubmit="handleRegister(event)">
                        <input type="text" name="name" placeholder="Full Name" required>
                        <input type="email" name="email" placeholder="Email" required>
                        <input type="password" name="password" placeholder="Password" minlength="6" required>
                        <button type="submit" class="btn btn-primary">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
